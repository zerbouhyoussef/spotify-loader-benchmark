services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-broker
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2182
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:9093,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_RETENTION_MS: 7200000
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server=localhost:9093 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    depends_on:
      zookeeper:
        condition: service_started

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper-server
    ports:
      - "2182:2182"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2182
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_MAX_CLIENT_CNXNS: 1000
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "stat, ruok, conf, cons, srvr, mntr"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2182 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:13
    container_name: postgres-server
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6543:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: benchmark
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    

  flink-jobmanager:
    build: loaders/flink/
    container_name: flink-jobmanager-server
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    command: /opt/flink/bin/jobmanager.sh start-foreground
    ports:
      - "8085:8081"
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
    volumes:
      - flink_data:/tmp

  flink-taskmanager:
    build: loaders/flink/
    container_name: flink-taskmanager-server
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://flink-jobmanager:8081/overview | python3 -c \"import sys,json; d=json.load(sys.stdin); exit(0 if d.get('taskmanagers',0)>0 else 1)\""]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    command: /opt/flink/bin/taskmanager.sh start-foreground
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      TASK_MANAGER_NUMBER_OF_TASK_SLOTS: 2
    volumes:
      - flink_data:/tmp
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

  airflow-init:
    build: airflow/
    container_name: airflow-init-server
    command:
      - bash
      - -c
      - "airflow db migrate && airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password fhTmFTxwFpVh4Cwn || true"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/benchmark
      AIRFLOW__CORE__FERNET_KEY: 'h9ZPhkY10GDVhsFR-ayL9lo6FZGgPwjgcu0nd0sfCp4='
      AIRFLOW__CORE__SECRET_KEY: 'dc7e2fae8b0f03690a7717324e406c96d9dfa0f7b497f179573b1c471e9505c4'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    build: airflow/
    container_name: airflow-webserver-server
    command: webserver
    group_add:
      - "988"
    ports:
      - "8090:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/benchmark
      AIRFLOW__CORE__FERNET_KEY: 'h9ZPhkY10GDVhsFR-ayL9lo6FZGgPwjgcu0nd0sfCp4='
      AIRFLOW__CORE__SECRET_KEY: 'dc7e2fae8b0f03690a7717324e406c96d9dfa0f7b497f179573b1c471e9505c4'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      AIRFLOW__WEBSERVER__BASE_URL: 'http://localhost:8090'
      _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
      BENCHMARK_PROJECT_DIR: /root/spotify-loader-benchmark
    volumes:
      - ${AIRFLOW_PROJ_DIR:-./airflow}/dags:/opt/airflow/dags
      - ${AIRFLOW_PROJ_DIR:-./airflow}/logs:/opt/airflow/logs
      - ${AIRFLOW_PROJ_DIR:-./airflow}/config:/opt/airflow/config
      - ${AIRFLOW_PROJ_DIR:-./airflow}/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    build: airflow/
    container_name: airflow-scheduler-server
    hostname: airflow-scheduler
    command: scheduler
    group_add:
      - "988"
    ports:
      - "8793:8793"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/benchmark
      AIRFLOW__CORE__FERNET_KEY: 'h9ZPhkY10GDVhsFR-ayL9lo6FZGgPwjgcu0nd0sfCp4='
      AIRFLOW__CORE__SECRET_KEY: 'dc7e2fae8b0f03690a7717324e406c96d9dfa0f7b497f179573b1c471e9505c4'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
      _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
      BENCHMARK_PROJECT_DIR: /root/spotify-loader-benchmark
    volumes:
      - ${AIRFLOW_PROJ_DIR:-./airflow}/dags:/opt/airflow/dags
      - ${AIRFLOW_PROJ_DIR:-./airflow}/logs:/opt/airflow/logs
      - ${AIRFLOW_PROJ_DIR:-./airflow}/config:/opt/airflow/config
      - ${AIRFLOW_PROJ_DIR:-./airflow}/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  metrics-producer:
    build: metrics/
    container_name: metrics-producer-server
    command: python -u producer.py
    depends_on:
      kafka:
        condition: service_healthy
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
    volumes:
      - ./metrics/data:/app/data:ro
    environment:
      KAFKA_BROKER_URL: kafka-broker:9093


  loader-raw-sql:
    build: loaders/
    container_name: loader-raw-sql-server
    command: python -u multithreaded_loader.py
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
    volumes:
      - ./metrics/data:/app/data:ro

  loader-celery:
    build: loaders/
    container_name: loader-celery-server
    command: python -u celery_loader.py
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
    volumes:
      - ./metrics/data:/app/data:ro

  loader-flink:
    build: loaders/flink/
    container_name: loader-flink-server
    command: /opt/flink/bin/flink run -py /opt/flink/flink_loader.py -m flink-jobmanager:8081
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      JAVA_TOOL_OPTIONS: "--add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED"
    volumes:
      - ./metrics/data:/app/data:ro


  redis:
    image: redis:latest
    container_name: redis-server
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  celery-worker:
    build: loaders/
    container_name: celery-worker-server
    command: celery -A tasks worker --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
    volumes:
      - ./metrics/data:/app/data:ro


volumes:
  postgres_data:
  flink_data:
  grafana_data:
  airflow_data:
  airflow_logs:
  airflow_config:
  airflow_plugins: